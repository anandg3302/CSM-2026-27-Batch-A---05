services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mediatrace-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./storage:/workspace/storage
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: mediatrace-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
